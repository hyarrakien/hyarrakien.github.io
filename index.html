function img(file,max,cb){
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=im.width*k;cv.height=im.height*k;cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL(max>300?'image/jpeg':'image/png',.85))};im.src=r.result};
  r.readAsDataURL(file);
}

function build(final){
  const h=document.documentElement.cloneNode(true);
  {const m=h.querySelector('#mp');if(m)m.remove()}h.querySelector('#app').innerHTML='';h.querySelector('#bd').removeAttribute('style');
  const e=h.querySelector('#editor');e.innerHTML='';e.className='';
  h.querySelector('#cfg').textContent=JSON.stringify(cfg).replace(/</g,'\\u003c');
  h.removeAttribute('style');h.querySelector('body').removeAttribute('style');
  if(final){h.dataset.final='1';h.querySelector('#adjbar').remove()}else h.removeAttribute('data-final');
  return '<!DOCTYPE html>\n'+h.outerHTML;
}
function exp(final){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([build(final)],{type:'text/html'}));
  a.download=final?'index.html':'meus-links-editavel.html';a.click();
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,i=+b.dataset.i,L=cfg.links,ed_=$('#editor');
  if(a==='share'){const u=location.href;navigator.share?navigator.share({url:u,title:cfg.name}).catch(()=>{}):navigator.clipboard&&navigator.clipboard.writeText(u);return}
  if(a==='edit'){ed();ed_.classList.add('open');return}
  if(a==='close'){ed_.classList.remove('open');return}
  if(a==='replay'){ed_.classList.remove('open');played=false;render();return}
  if(a==='tab'){tab=b.dataset.t;ed(true);return}
  if(a==='tgl'){openL=openL===i?-1:i;ed();return}
  if(a==='tgt'){openT=openT===i?-1:i;ed();return}
  if(a==='undo'||a==='redo'){undo(a==='undo'?-1:1);return}
  if(a==='theme'){Object.assign(cfg,THEMES[i].v);commit();render();save();ed();return}
  if(a==='pub'){publish();return}
  if(a==='pubgo'){tab='publicar';ed(true);publish();return}
  if(a==='forget'){ghSet({t:''});GL=[];ed();return}
  if(a==='bak'){const x=document.createElement('a');x.href=URL.createObjectURL(new Blob([JSON.stringify(cfg)],{type:'application/json'}));x.download='meus-links-backup.json';x.click();return}
  if(a==='adj'){document.body.classList.add('adj');$('#adjz').value=cfg.iz;return}
  if(a==='adjdone'){document.body.classList.remove('adj');commit();ed();return}
  if(a==='rimg'){cfg.ix=0;cfg.iy=0;cfg.iz=100}
  if(a==='exp1')return exp(true);
  if(a==='exp0')return exp(false);
  if(a==='reset'){if(confirm('Voltar ao modelo original?')){try{localStorage.removeItem('meus-links-v2')}catch(x){}location.reload()}return}
  if(a==='rmimg')cfg.img='';
  if(a==='rmicon')L[i].i='';
  if(a==='addl'){L.push({t:'novo link',u:'https://',i:'',p:'link'});openL=L.length-1}
  if(a==='dl'){L.splice(i,1);openL=-1}
  if(a==='dup'){L.splice(i+1,0,{...L[i]});openL=i+1}
  if(a==='hid')L[i].h=!L[i].h;
  const TR=cfg.tracks;
  if(a==='tdl'){TR.splice(i,1);openT=-1}
  if(a==='tdup'){TR.splice(i+1,0,{...TR[i]});openT=i+1}
  if(a==='tup'&&i>0){[TR[i-1],TR[i]]=[TR[i],TR[i-1]];openT=i-1}
  if(a==='tdown'&&i<TR.length-1){[TR[i+1],TR[i]]=[TR[i],TR[i+1]];openT=i+1}
  if(a==='rmtcov')TR[i].c='';
  if(a==='rmcov')cfg.mcov='';
  if(a==='up'&&i>0){[L[i-1],L[i]]=[L[i],L[i-1]];openL=i-1}
  if(a==='down'&&i<L.length-1){[L[i+1],L[i]]=[L[i],L[i+1]];openL=i+1}
  if(a==='adds')cfg.soc.push({k:'link',u:'https://'});
  if(a==='ds')cfg.soc.splice(i,1);
  render();save();commit();ed();
});

$('#editor').addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.g){ghSet({[d.g]:t.value});return}
  if(t.type==='range'){const b=t.parentElement.querySelector('b');if(b)b.textContent=t.value}
  if(d.k){cfg[d.k]=t.type==='range'?+t.value:t.type==='checkbox'?t.checked:t.value;if(d.k==='snd')snd()}
  else if(d.l){cfg[d.l][d.i][d.f]=t.value;if(d.f==='t'){const h=t.closest('.lc').querySelector('.lt');if(h)h.textContent=t.value||'(sem título)'}}else return;
  render();save();
});
$('#editor').addEventListener('change',e=>{
  const t=e.target,d=t.dataset;
  if(t.type==='file'&&t.files[0]){
    if(d.up==='bak'){t.files[0].text().then(x=>{try{cfg={...DEF,...JSON.parse(x)};render();save();commit();ed()}catch(er){alert('Arquivo inválido')}});return}
    if(d.up==='mp3'){[...t.files].forEach(f=>{const p='musicas/'+f.name;LOCAL[p]=URL.createObjectURL(f);cfg.tracks.push({t:f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' '),a:'',s:p,c:''})});openT=cfg.tracks.length-1;render();save();commit();ed();return}
    img(t.files[0],d.up==='img'?1600:128,u=>{if(d.up==='img')cfg.img=u;else if(d.up==='mcov')cfg.mcov=u;else if(d.up==='tcov')cfg.tracks[+d.i].c=u;else cfg.links[+d.i].i=u;render();save();commit();ed()});return}
  if(d.l&&d.f==='k')ed();
  commit();
});
if(!FINAL){
 const P=new Map(),adj=()=>document.body.classList.contains('adj'),clamp=z=>Math.min(400,Math.max(20,Math.round(z)));let g=null;
 const snap=()=>{const a=[...P.values()];g={ix:cfg.ix,iy:cfg.iy,iz:cfg.iz,x:a[0].x,y:a[0].y,d:a[1]?Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y):0}};
 addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('.hero');if(!adj()||!h)return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});try{h.setPointerCapture(e.pointerId)}catch(x){}snap()});
 addEventListener('pointermove',e=>{if(!P.has(e.pointerId))return;P.set(e.pointerId,{x:e.clientX,y:e.clientY});const a=[...P.values()],h=$('.hero').getBoundingClientRect();
  cfg.ix=Math.round((g.ix+(a[0].x-g.x)/h.width*100)*10)/10;cfg.iy=Math.round((g.iy+(a[0].y-g.y)/h.height*100)*10)/10;
  if(a[1]&&g.d)cfg.iz=clamp(g.iz*Math.hypot(a[1].x-a[0].x,a[1].y-a[0].y)/g.d);
  V();$('#adjz').value=cfg.iz;save()});
 const up=e=>{if(P.delete(e.pointerId)&&P.size)snap()};addEventListener('pointerup',up);addEventListener('pointercancel',up);
 addEventListener('wheel',e=>{if(!adj()||!e.target.closest('.hero'))return;e.preventDefault();cfg.iz=clamp(cfg.iz*(e.deltaY<0?1.06:.94));V();$('#adjz').value=cfg.iz;save()},{passive:false});
 $('#adjz').addEventListener('input',e=>{cfg.iz=+e.target.value;V();save()});
}
if(!FINAL){
 $('#editor').addEventListener('dblclick',e=>{const l=e.target.closest('label[data-r]');if(!l)return;cfg[l.dataset.r]=DEF[l.dataset.r];commit();render();save();ed()});
 addEventListener('keydown',e=>{const k=e.key.toLowerCase(),f=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if((e.ctrlKey||e.metaKey)&&k==='z'&&!f){e.preventDefault();undo(e.shiftKey?1:-1)}
  else if((e.ctrlKey||e.metaKey)&&k==='y'&&!f){e.preventDefault();undo(1)}
  else if(k==='escape'&&!document.body.classList.contains('adj'))$('#editor').classList.remove('open')});
}
commit();render();
